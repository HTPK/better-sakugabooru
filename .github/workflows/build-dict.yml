name: build-dict

# Rebuilds dict/dist/dict.json whenever the hand-edited or generated data changes.
# Generation against Wikidata is NOT run here (it takes hours and
# hits third-party APIs); run dict/scripts/gen_*.py locally and commit dict/data/.

on:
  push:
    branches: [main]
    paths:
      - "dict/data/**"
      - "dict/scripts/**"
      - ".github/workflows/build-dict.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Test
        run: python -m pytest -q
      - name: Build dict/dist/dict.json
        env:
          PYTHONUTF8: "1"
        run: python scripts/build.py
      - name: Commit dist if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ REVIEW.md COVERAGE.md
          if git diff --cached --quiet; then
            echo "dist unchanged"
          else
            git commit -m "build: refresh dist/dict.json"
            git push
          fi
