<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=380" />
    <title>SakuView</title>
  </head>
  <body>
    <div class="pp">
      <header class="pp-head">
        <span class="pp-brand">SakuView</span>
        <span class="pp-sub" data-i18n="ppSettings">設定</span>
        <span class="pp-version" id="pp-version"></span>
      </header>

      <main class="pp-body">
        <section class="pp-section pp-gap8">
          <div class="pp-h" data-i18n="ppTheme">テーマ</div>
          <div class="pp-theme" role="group" aria-label="テーマ" data-i18n-attr="aria-label:ppTheme" data-seg="theme">
            <button type="button" data-value="light" aria-pressed="false" data-i18n="ppLight">ライト</button>
            <button type="button" data-value="dark" aria-pressed="false" data-i18n="ppDark">ダーク</button>
            <button type="button" data-value="system" aria-pressed="false" data-i18n="ppSystem">OS に合わせる</button>
          </div>
        </section>

        <section class="pp-section pp-gap2">
          <div class="pp-h pp-h-features" data-i18n="ppFeatures">機能</div>
          <label class="pp-feature"><input type="checkbox" data-key="translateTags" /><span class="pp-feature-text"><span data-i18n="ppTranslate">タグを日本語で表示</span><span class="pp-hint" data-i18n="ppTranslateHint">辞書にある作画者・作品・技法を日本語に</span></span></label>
          <label class="pp-feature"><input type="checkbox" data-key="showRomaji" /><span class="pp-feature-text"><span data-i18n="ppRomaji">原文 (ローマ字) も小さく表示</span><span class="pp-hint" data-i18n="ppRomajiHint">コピーや英語での検索に使う</span></span></label>
          <label class="pp-feature"><input type="checkbox" data-key="searchSuggest" /><span class="pp-feature-text"><span data-i18n="ppSuggest">検索ボックスの日本語補完</span><span class="pp-hint" data-i18n="ppSuggestHint">漢字・かなで打つと英語タグを提案</span></span></label>
          <label class="pp-feature"><input type="checkbox" data-key="hoverPlay" /><span class="pp-feature-text"><span data-i18n="ppHover">一覧でホバー再生</span><span class="pp-hint" data-i18n="ppHoverHint">サムネに乗せると無音で再生</span></span></label>
          <label class="pp-feature"><input type="checkbox" data-key="frontToPosts" /><span class="pp-feature-text"><span data-i18n="ppFront">トップページを新着一覧に</span><span class="pp-hint" data-i18n="ppFrontHint">sakugabooru.com を開くと投稿一覧へ</span></span></label>
          <label class="pp-feature"><input type="checkbox" data-key="forceJaLocale" /><span class="pp-feature-text"><span data-i18n="ppJaLocale">日本語モード</span><span class="pp-hint" data-i18n="ppJaLocaleHint">サイトの日本語表示とタグの日本語化。オフでサイトも拡張も英語に</span></span></label>
          <label class="pp-feature"><input type="checkbox" data-key="webFonts" /><span class="pp-feature-text"><span data-i18n="ppFonts">Web フォント (Noto Sans JP) を読み込む</span><span class="pp-hint" data-i18n="ppFontsHint">オフにすると端末のフォントで表示</span></span></label>
        </section>

        <section class="pp-section pp-gap8">
          <div class="pp-h" data-i18n="ppList">一覧の表示</div>
          <div class="pp-grid">
            <span class="pp-label" data-i18n="ppPerPage">1 ページの件数</span>
            <span class="pp-seg pp-en" role="group" aria-label="1 ページの件数" data-i18n-attr="aria-label:ppPerPage" data-seg="perPage">
              <button type="button" data-value="24" aria-pressed="false">24</button>
              <button type="button" data-value="40" aria-pressed="false">40</button>
              <button type="button" data-value="60" aria-pressed="false">60</button>
              <button type="button" data-value="100" aria-pressed="false">100</button>
            </span>
            <span class="pp-label" data-i18n="ppThumb">サムネの大きさ</span>
            <span class="pp-seg" role="group" aria-label="サムネの大きさ" data-i18n-attr="aria-label:ppThumb" data-seg="thumbSize">
              <button type="button" data-value="small" aria-pressed="false"><span data-i18n="ppSmall">小</span> <span class="pp-en pp-cols" data-i18n-cols="8">8列</span></button>
              <button type="button" data-value="medium" aria-pressed="false"><span data-i18n="ppMedium">中</span> <span class="pp-en pp-cols" data-i18n-cols="6">6列</span></button>
              <button type="button" data-value="large" aria-pressed="false"><span data-i18n="ppLarge">大</span> <span class="pp-en pp-cols" data-i18n-cols="4">4列</span></button>
            </span>
          </div>
          <div class="pp-card">
            <span class="pp-card-h" data-i18n="ppUnder">サムネの下に表示</span>
            <label class="pp-row"><input type="checkbox" data-key="showCopyright" /><span class="pp-grow" data-i18n="ppWork">作品名</span></label>
            <label class="pp-row"><input type="checkbox" data-key="showArtist" /><span class="pp-grow" data-i18n="ppArtist">作画者</span></label>
            <label class="pp-row"><input type="checkbox" data-key="showScoreDate" /><span class="pp-grow" data-i18n="ppScoreDate">点数と投稿日</span></label>
            <label class="pp-row"><input type="checkbox" data-key="showTech" /><span class="pp-grow" data-i18n="ppTech">技法タグ</span>
              <span class="pp-stepper pp-en">
                <button type="button" id="pp-tech-dec" aria-label="減らす" data-i18n-attr="aria-label:ppDec">-</button>
                <span class="pp-step-value" id="pp-tech-value"></span>
                <button type="button" id="pp-tech-inc" aria-label="増やす" data-i18n-attr="aria-label:ppInc">+</button>
              </span><span class="pp-hint" data-i18n="ppTechUpTo">件まで</span>
            </label>
          </div>
        </section>
      </main>

      <footer class="pp-foot">
        <span class="pp-dict">
          <span><span data-i18n="ppDictWord">辞書</span> <span class="pp-en" id="pp-dict-count"></span> <span data-i18n="ppDictEntries">語</span><span data-i18n="wideSep">　</span><span data-i18n="ppDictUpdated">更新</span> <span class="pp-en" id="pp-dict-date"></span></span>
          <span class="pp-faint" data-i18n="ppAuto">毎日自動で更新されます</span>
          <span class="pp-error" id="pp-dict-error" hidden></span>
        </span>
        <button type="button" class="pp-refresh" id="pp-refresh" data-i18n="ppRefresh">今すぐ更新</button>
        <a class="pp-link" href="https://github.com/HTPK/better-sakugabooru/issues/new?template=translation.yml" target="_blank" rel="noopener" data-i18n="ppPropose">訳を提案</a>
      </footer>
    </div>
    <script type="module">
      import { initPopup } from './main.ts'
      void initPopup(document)
    </script>
  </body>
</html>
